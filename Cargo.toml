[package]
name = "daat-locus"
version = "0.5.0"
edition = "2024"
description = "Infrastructure for a local actor-based agent system with Apps and a WebUI."
license = "Apache-2.0"
authors = ["shadow3 <shadow3aaaa@gmail.com>"]
repository = "https://github.com/shadow3aaa/DaatLocus"
readme = "README.md"
keywords = ["agent", "actor", "apps", "webui"]
categories = ["development-tools"]
include = [
    "/Cargo.lock",
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/README_zh-CN.md",
    "/AGENTS.md",
    "/assets/logo.svg",
    "/assets/logo-mark.svg",
    "/build.rs",
    "/docs/**",
    "/src/**",
    "/webui/bun.lock",
    "/webui/components.json",
    "/webui/index.html",
    "/webui/package.json",
    "/webui/scripts/**",
    "/webui/src/**",
    "/webui/tailwind.config.cjs",
    "/webui/tsconfig.json",
    "/webui/vite.config.ts",
]

[workspace]
members = [
    ".",
    "crates/daat-locus-macros",
    "crates/daat-locus-auth",
    "crates/daat-locus-client-protocol",
    "clients/app/src-tauri",
    "xtask",
]
default-members = ["."]
resolver = "3"

[workspace.dependencies]
mimalloc = { version = "0.1.52", default-features = false }

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-{ target }.tar.zst"
pkg-fmt = "tzstd"
bin-dir = "{ name }-{ version }-{ target }/{ bin }{ binary-ext }"
disabled-strategies = ["quick-install", "compile"]

[dependencies]
hex = "0.4.3"
async-trait = "0.1.89"
axum = "0.8.4"
base64 = "0.22.1"
chrono = "0.4.45"
clap = { version = "4.5.38", features = ["derive"] }
diffy = "0.5.0"
futures-util = "0.3.31"
libc = "0.2"
md-5 = "0.11.0"
miette = { version = "7.6.0", features = ["fancy"] }
parking_lot = "0.12.5"
postcard = { version = "1.1.3", features = ["alloc", "use-std"] }
quinn = "0.11.11"
reqwest = { version = "0.13.2", features = [
    "json",
    "stream",
    "query",
] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
sysinfo = "0.39.5"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
toml = "1.1.2"
tracing = "0.1.41"
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "chrono"] }
uuid = { version = "1.23.4", features = ["serde", "v4", "v7"] }
viewpoint-core = "0.4"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
regex = "1.12.4"
url = "2.5.8"
zeroize = "1"
openraft = { version = "=0.9.21", features = ["serde", "storage-v2"] }
daat-locus-macros = { version = "0.2.1", path = "crates/daat-locus-macros" }
daat-locus-auth = { path = "crates/daat-locus-auth" }
daat-locus-client-protocol = { path = "crates/daat-locus-client-protocol" }
ed25519-dalek = { version = "2.2.0", features = ["pkcs8"] }
getrandom = "0.4.2"
rcgen = "0.14.10"
rustls = { version = "0.23.44", default-features = false, features = ["ring", "std"] }
rustls-platform-verifier = "0.7"
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring"] }
mdns-sd = "0.21.5"
flume = "0.12.0"
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-native-roots"] }
webrtc = "0.17.1"

[dev-dependencies]
tempfile = "3.23.0"

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
mimalloc = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
webpki-roots = "1.0.8"

[build-dependencies]
reqwest = { version = "0.13.2", features = ["blocking"] }
serde_json = "1.0.150"
[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61.2"
features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemServices",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 's'
strip = true
