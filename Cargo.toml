[package]
name = "daat-locus"
version = "0.5.0"
edition = "2024"
description = "Infrastructure for a local actor-based agent system with Apps and a WebUI."
license = "Apache-2.0"
authors = ["shadow3 <shadow3aaaa@gmail.com>"]
repository = "https://github.com/shadow3aaa/DaatLocus"
readme = "README.md"
keywords = ["agent", "actor", "apps", "webui"]
categories = ["development-tools"]
include = [
    "/Cargo.lock",
    "/Cargo.toml",
    "/LICENSE",
    "/NOTICE",
    "/README.md",
    "/README_zh-CN.md",
    "/AGENTS.md",
    "/assets/logo.svg",
    "/assets/logo-mark.svg",
    "/build.rs",
    "/docs/**",
    "/src/**",
    "/webui/bun.lock",
    "/webui/components.json",
    "/webui/index.html",
    "/webui/package.json",
    "/webui/scripts/**",
    "/webui/src/**",
    "/webui/tailwind.config.cjs",
    "/webui/tsconfig.json",
    "/webui/vite.config.ts",
    "/webui/dist/**",
]

[workspace]
members = [
    ".",
    "crates/daat-locus-macros",
    "crates/daat-locus-auth",
    "crates/daat-locus-client-protocol",
    "crates/daat-locus-virtual-workspace",
    "crates/daat-locus-virtual-workspace/hook",
    "crates/daat-locus-computer-use",
    "clients/app/src-tauri",
    "xtask",
]
default-members = ["."]
exclude = ["crates/daat-locus-virtual-workspace/driver"]
resolver = "3"

[features]
default = ["embedded-webui"]
embedded-webui = []

[workspace.dependencies]
mimalloc = { version = "0.1.52", default-features = false }

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-{ target }.tar.zst"
pkg-fmt = "tzstd"
bin-dir = "{ name }-{ version }-{ target }/{ bin }{ binary-ext }"
disabled-strategies = ["quick-install", "compile"]

[dependencies]
hex = "0.4.3"
async-trait = "0.1.89"
axum = "0.8.4"
base64 = "0.23.1"
chrono = "0.4.45"
clap = { version = "4.5.38", features = ["derive"] }
diffy = "0.5.0"
futures-util = "0.3.31"
libc = "0.2"
md-5 = "0.11.0"
miette = "7.6.0"
parking_lot = "0.12.5"
postcard = { version = "1.1.3", features = ["alloc", "use-std"] }
quinn = "0.11.11"
reqwest = { version = "0.13.5", default-features = false, features = [
    "rustls-no-provider",
    "charset",
    "http2",
    "system-proxy",
    "json",
    "stream",
    "query",
] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
sysinfo = "0.39.5"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
toml = "1.1.2"
tracing = "0.1.41"
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "chrono"] }
uuid = { version = "1.23.4", features = ["serde", "v4", "v7"] }
zip = { version = "9.0.4", default-features = false, features = ["deflate"] }
regex = "1.12.4"
rmcp = { version = "3.5.1", default-features = false, features = ["client", "transport-async-rw", "transport-streamable-http-client-reqwest"] }
jsonschema = { version = "0.59", default-features = false }
url = "2.5.8"
zeroize = "1"
zstd = { version = "0.13", default-features = false }
openraft = { version = "=0.9.25", features = ["serde", "storage-v2"] }
daat-locus-macros = { version = "0.2.1", path = "crates/daat-locus-macros" }
daat-locus-auth = { path = "crates/daat-locus-auth" }
daat-locus-client-protocol = { path = "crates/daat-locus-client-protocol" }
ed25519-dalek = { version = "2.2.0", features = ["pkcs8"] }
getrandom = "0.4.2"
rcgen = "0.14.10"
rustls = { version = "0.23.44", default-features = false, features = ["ring", "std"] }
rustls-platform-verifier = "0.7"
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring"] }
mdns-sd = "0.21.5"
flume = "0.12.0"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
webrtc = { version = "0.21.1", default-features = false, features = ["runtime-tokio", "crypto-ring"] }
rtc-stun = { version = "0.21.1", default-features = false, features = ["crypto-ring"] }
dunce = "1.0.5"

[dev-dependencies]
tempfile = "3.23.0"

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
mimalloc = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]

[target.'cfg(not(target_os = "android"))'.dependencies]
viewpoint-core = "0.4"
miette = { version = "7.6.0", features = ["fancy"] }

[build-dependencies]
reqwest = { version = "0.13.2", features = ["blocking"] }
serde_json = "1.0.150"
zstd = { version = "0.13", default-features = false }
[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61.2"
features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemServices",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
]

[target.'cfg(windows)'.dependencies]
appcontainer_common = { git = "https://github.com/microsoft/mxc", rev = "6cd3d58f05d3447e67109cfb75e042803b843ca4" }
learning_mode_windows = { git = "https://github.com/microsoft/mxc", rev = "6cd3d58f05d3447e67109cfb75e042803b843ca4" }
wxc_common = { git = "https://github.com/microsoft/mxc", rev = "6cd3d58f05d3447e67109cfb75e042803b843ca4" }
tracelogging = "=1.2.3"
daat-locus-virtual-workspace = { path = "crates/daat-locus-virtual-workspace" }
png = "0.18"
windows = { version = "0.62.2", features = ["Win32_UI_Shell", "Win32_System_Com", "Win32_Foundation"] }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
strip = "symbols"
