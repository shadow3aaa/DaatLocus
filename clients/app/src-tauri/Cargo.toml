[package]
name = "daat-locus-app"
version = "0.5.0"
edition = "2024"
publish = false
description = "Daat Locus native client."
license = "Apache-2.0"

[lib]
name = "daat_locus_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
clap = { version = "4.5.38", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
daat-locus-client-protocol = { path = "../../../crates/daat-locus-client-protocol" }
sha2 = "0.11.0"
tokio = { version = "1", features = ["process", "time", "rt-multi-thread", "macros", "io-util"] }
url = "2"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
open = "5"
sys-locale = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
resvg = { version = "0.47", default-features = false }
ico = "0.5"
png = "0.18"
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
tauri = { version = "2", features = ["image-png"] }
daat-locus = { path = "../../.." }
axum = "0.8"
tracing = "0.1"
jni = "0.22"
rustls-platform-verifier = "0.7"
ndk-context = "0.1"
tauri-plugin-opener = "2"

[dev-dependencies]
tempfile = "3"
