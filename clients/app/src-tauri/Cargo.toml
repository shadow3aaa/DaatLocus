[package]
name = "daat-locus-app"
version = "0.5.0"
edition = "2024"
publish = false
description = "Daat Locus native client."
license = "Apache-2.0"

[lib]
name = "daat_locus_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
custom-protocol = ["tauri/custom-protocol"]
native-contract = ["daat-locus-computer-use/native-contract"]

[dependencies]
clap = { version = "4.5.38", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
daat-locus-client-protocol = { path = "../../../crates/daat-locus-client-protocol" }
sha2 = "0.11.0"
tokio = { version = "1", features = ["process", "time", "rt-multi-thread", "macros", "io-util", "sync"] }
url = "2"
reqwest = { version = "0.13.2", default-features = false, features = ["stream"] }
cookie = "0.18"
bytes = "1"

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "android"))'.dependencies]
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
mimalloc = { workspace = true }
rustls = { version = "0.23.44", default-features = false, features = ["ring", "std"] }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
open = "5"
sys-locale = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Controls", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm"] }

[target.'cfg(target_os = "macos")'.dependencies]
daat-locus-computer-use = { path = "../../../crates/daat-locus-computer-use" }

[build-dependencies]
tauri-build = { version = "2", features = [] }
resvg = { version = "0.47", default-features = false }
ico = "0.5"
png = "0.18"
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
mimalloc = { workspace = true, features = ["local_dynamic_tls"] }
tauri = { version = "2", features = [] }
daat-locus = { path = "../../..", default-features = false }
axum = "0.8"
tracing = "0.1"
jni = "0.22"
rustls-platform-verifier = "0.7"
ndk-context = "0.1"
miette = "7.6.0"
tauri-plugin-opener = "2"

[dev-dependencies]
tempfile = "3"
