name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      DAAT_LOCUS_BUILD_WEBUI: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build and validate virtual display driver
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo fmt --manifest-path crates/daat-locus-virtual-workspace/driver/Cargo.toml -- --check
          cargo run --locked -p xtask -- idd-driver --check
          cargo build --locked -p daat-locus-workspace-hook
          cargo clippy --locked -p daat-locus-virtual-workspace --features driver-setup --bin daat-locus-display-setup -- -D warnings
          cargo test --locked -p daat-locus-virtual-workspace --features driver-setup --lib windows::driver_trust
      - name: Install Linux sandbox prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          # The disposable runner must permit the user namespaces exercised by bwrap.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked -p daat-locus -p daat-locus-auth -p daat-locus-client-protocol -p daat-locus-macros -p daat-locus-virtual-workspace -p daat-locus-workspace-hook -p xtask --all-targets -- -D warnings
      - run: cargo test --locked -p daat-locus --lib --bins --test http_api -- --test-threads=4 --skip actors::runner::tests::three_device_core_preserves_resources_context_and_effects_across_sequential_takeover
      - name: Check sequential device takeover
        env:
          DAAT_LOCUS_TEST_STAGE_TRACE: '1'
        run: cargo test --locked -p daat-locus --lib actors::runner::tests::three_device_core_preserves_resources_context_and_effects_across_sequential_takeover -- --exact
      - name: Check required Linux native sandbox
        if: runner.os == 'Linux'
        run: |
          cargo test --locked -p daat-locus --lib sandbox:: -- --include-ignored --test-threads=4
      - name: Check required macOS private control isolation
        if: runner.os == 'macOS'
        run: cargo test --locked -p daat-locus --lib sandbox::macos::tests::owner_control_socket_is_denied_even_with_broad_filesystem_grants -- --ignored --exact
      - name: Check Windows symlink escape protection
        if: runner.os == 'Windows'
        run: cargo test --locked -p daat-locus --lib file_io::tests::symlink_escape_is_denied -- --ignored --exact
      - run: cargo test --locked -p daat-locus-auth -p daat-locus-client-protocol -p daat-locus-macros -p daat-locus-virtual-workspace -p xtask
  windows-mxc:
    # The public Windows images may not expose PSEC. A provisioned runner is
    # required; skipped means unavailable, never a positive isolation result.
    if: ${{ vars.MXC_RUNNER != '' }}
    runs-on: ${{ vars.MXC_RUNNER }}
    env:
      DAAT_LOCUS_BUILD_WEBUI: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Require native MXC/PSEC
        run: cargo test --locked --no-default-features --lib sandbox::windows::tests::require_native_mxc -- --ignored --exact
      - name: Check native sandbox boundaries and lifecycle
        run: cargo test --locked --no-default-features --lib sandbox:: -- --include-ignored --test-threads=4
      - name: Check native Terminal
        run: cargo test --locked --no-default-features --lib terminal_app::process::tests::terminal_shell_runs_inside_required_native_isolation -- --ignored --exact
      - name: Check native MCP transport
        run: cargo test --locked --no-default-features --lib mcp::tests::stdio_uses_native_sandbox_explicit_environment_and_reaps_processes -- --ignored --exact
  desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - run: cargo install wasm-pack --locked
      - run: bun scripts/build-webui.ts
      - run: cargo clippy --locked -p daat-locus-app --all-targets -- -D warnings
      - run: cargo test --locked -p daat-locus-app
      - run: cargo build --locked -p daat-locus-app --features custom-protocol
  webui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
      - run: cargo install wasm-pack --locked
      - run: bun install --frozen-lockfile
        working-directory: webui
      - run: bun run typecheck && bun test && bun run build
        working-directory: webui
      - name: Verify default embedded build
        run: cargo build --locked -p daat-locus

  signaling:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/signaling
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,wasm32-unknown-unknown
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.11902837"
      - run: echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.11902837" >> "$GITHUB_ENV"
      - run: cargo install wasm-pack --locked
      - run: bun install --frozen-lockfile
        working-directory: webui
      - run: bun install --frozen-lockfile
        working-directory: clients/app
      - run: bun run android:build --debug
        working-directory: clients/app
