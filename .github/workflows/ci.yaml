name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      DAAT_LOCUS_BUILD_WEBUI: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build and validate virtual display driver
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo fmt --manifest-path crates/daat-locus-virtual-workspace/driver/Cargo.toml -- --check
          cargo run --locked -p xtask -- idd-driver --check
          cargo run --locked -p xtask -- idd-driver --test
          cargo run --locked -p xtask -- idd-driver
          cargo build --locked -p daat-locus-workspace-hook
          cargo clippy --locked -p daat-locus-virtual-workspace --features driver-setup --bin daat-locus-display-setup -- -D warnings
          cargo test --locked -p daat-locus-virtual-workspace --features driver-setup --lib windows::driver_trust
      - name: Install Linux sandbox prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          # The disposable runner must permit the user namespaces exercised by bwrap.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: cargo fmt --all -- --check
      - name: Build service with embedded Bash entry
        run: cargo build --locked -p daat-locus --no-default-features --bin daat-locus
      - name: Check native sandbox filesystem contracts
        run: cargo test --locked -p daat-locus-sandbox -- --test-threads=4
      - name: Diagnose macOS sandbox startup failures
        if: failure() && runner.os == 'macOS'
        run: |
          python3 scripts/macos-sandbox-diagnostics.py
          sudo /usr/bin/log show --last 5m --style compact --predicate 'process == "sandboxd" OR subsystem == "com.apple.sandbox"' | tail -n 120
      - run: cargo clippy --locked -p daat-locus -p daat-locus-sandbox -p daat-locus-bash -p daat-locus-uutils -p daat-locus-auth -p daat-locus-client-protocol -p daat-locus-computer-use -p daat-locus-macros -p daat-locus-virtual-workspace -p daat-locus-workspace-hook -p xtask --all-targets -- -D warnings
      - run: cargo test --locked -p daat-locus --lib --bins --test bash_subprocess --test http_api --test sandbox_authority --test web_host_recovery -- --test-threads=4 --skip actors::runner::tests::three_device_core_preserves_resources_context_and_effects_across_sequential_takeover
      - name: Check sequential device takeover
        env:
          DAAT_LOCUS_TEST_STAGE_TRACE: '1'
        run: cargo test --locked -p daat-locus --lib actors::runner::tests::three_device_core_preserves_resources_context_and_effects_across_sequential_takeover -- --exact
      - name: Verify the Unix administrator helper with real root authority
        if: runner.os != 'Windows'
        env:
          DAAT_LOCUS_TEST_COMPANION: ${{ github.workspace }}/target/debug/daat-locus
        run: cargo test --locked -p daat-locus --lib root_helper_reads_protected_files_without_elevating_the_service -- --ignored --nocapture --test-threads=1
      - name: Check macOS native host integration
        if: runner.os == 'macOS'
        run: cargo clippy --locked -p daat-locus-app --features native-contract --all-targets -- -D warnings
      - name: Check Windows symlink escape protection
        if: runner.os == 'Windows'
        run: cargo test --locked -p daat-locus --lib file_io::tests::symlink_escape_is_denied -- --ignored --exact
      - run: cargo test --locked -p daat-locus-bash -p daat-locus-uutils -p daat-locus-auth -p daat-locus-client-protocol -p daat-locus-computer-use -p daat-locus-macros -p daat-locus-virtual-workspace -p xtask -- --test-threads=4
      - name: Install WiX for Windows upgrade transaction tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet tool install --global wix --version 6.0.0
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" extension add --global WixToolset.BootstrapperApplications.wixext/6.0.0
      - name: Check service coordination across MSI success and rollback
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo build --locked -p daat-locus --bin daat-locus --no-default-features
          cargo test --locked -p daat-locus --test installer_upgrade -- --test-threads=1
          $env:DAAT_LOCUS_TEST_COMPANION = Join-Path $env:GITHUB_WORKSPACE 'target/debug/daat-locus.exe'
          cargo test --locked -p xtask -- service_lifecycle_surrounds_msi_and_restores_the_service_after_rollback --ignored --nocapture --test-threads=1
  desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - run: cargo install wasm-pack --locked
      - run: bun scripts/build-webui.ts
      - run: cargo clippy --locked -p daat-locus-app --all-targets -- -D warnings
      - run: cargo test --locked -p daat-locus-app
      - name: Verify native background tab and keyboard isolation
        run: cargo test --locked -p daat-locus-app --features web-contract --test browser_live background_tabs_do_not_change_owner_selection_or_keyboard_focus -- --ignored
      - run: cargo build --locked -p daat-locus-app --features custom-protocol
  webui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
      - run: cargo install wasm-pack --locked
      - run: bun install --frozen-lockfile
        working-directory: webui
      - run: bun run typecheck && bun test && bun run build
        working-directory: webui
      - name: Verify default embedded build
        run: cargo build --locked -p daat-locus

  relay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/signaling
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun test tests/local.test.ts
        env:
          DAAT_LOCUS_TEST_RELAY_WORKER: "1"

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,wasm32-unknown-unknown
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
      - run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;27.2.12479018"
      - run: echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - run: cargo install wasm-pack --locked
      - run: bun install --frozen-lockfile
        working-directory: webui
      - run: bun install --frozen-lockfile
        working-directory: clients/app
      - run: bun run android:build --debug
        working-directory: clients/app
  android-phone-use:
    # Requires two disposable, provisioned API 35+ emulators. A skipped job is
    # unavailable coverage, never evidence of a successful privilege test.
    if: ${{ vars.PHONE_USE_RUNNER != '' }}
    runs-on: ${{ vars.PHONE_USE_RUNNER }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        method: [shizuku, root]
    env:
      DAAT_LOCUS_ANDROID_SIGNING: ${{ secrets.PHONE_USE_TEST_SIGNING }}
      DAAT_LOCUS_PHONE_TEST_PASSWORD: ${{ secrets.PHONE_USE_TEST_PASSWORD }}
      DAAT_LOCUS_ANDROID_ABI: arm64-v8a
      PHONE_SERIAL: ${{ matrix.method == 'root' && vars.PHONE_USE_ROOT_SERIAL || vars.PHONE_USE_SHIZUKU_SERIAL }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,wasm32-unknown-unknown
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
      - run: cargo install wasm-pack --locked
      - run: bun install --frozen-lockfile
        working-directory: webui
      - run: bun install --frozen-lockfile
        working-directory: clients/app
      - run: bun run android:build
        working-directory: clients/app
      - run: ./gradlew :phone-use-fixture:assembleDebug :app:assembleUniversalReleaseAndroidTest -x :app:rustBuildUniversalRelease
        working-directory: clients/app/src-tauri/gen/android
      - name: Require real native privilege and display isolation
        run: >-
          python3 clients/app/scripts/test-phone-use.py
          --serial "$PHONE_SERIAL" --method "${{ matrix.method }}"
          --account "phone-test-ci-${{ matrix.method }}"
          --app-apk clients/app/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          --test-apk clients/app/src-tauri/gen/android/app/build/outputs/apk/androidTest/universal/release/app-universal-release-androidTest.apk
          --fixture-apk clients/app/src-tauri/gen/android/phone-use-fixture/build/outputs/apk/debug/phone-use-fixture-debug.apk
