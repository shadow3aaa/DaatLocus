name: Release Binaries
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag; leave empty for workflow artifacts only
        required: false
        type: string
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
      - run: cargo install wasm-pack --locked
      - id: host
        shell: bash
        run: |
          echo "target=$(rustc -vV | sed -n 's/^host: //p')" >> "$GITHUB_OUTPUT"
      - name: Build embedded binary archive
        run: cargo xtask package binary --target "${{ steps.host.outputs.target }}"
      - uses: actions/setup-dotnet@v4
        if: runner.os == 'Windows'
        with:
          dotnet-version: '8.x'
      - name: Install WiX
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 6.0.0
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" extension add WixToolset.Util.wixext/6.0.0
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" extension add WixToolset.BootstrapperApplications.wixext/6.0.0
      - name: Package Windows installers
        if: runner.os == 'Windows'
        run: cargo xtask package windows --skip-build --target "${{ steps.host.outputs.target }}"
      - name: Package macOS app and installer
        if: runner.os == 'macOS'
        run: cargo xtask package macos --skip-build --target "${{ steps.host.outputs.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: daat-locus-${{ steps.host.outputs.target }}
          if-no-files-found: error
          path: |
            target/${{ steps.host.outputs.target }}/release/package/*.tar.zst
            target/${{ steps.host.outputs.target }}/release/package/*.msi
            target/${{ steps.host.outputs.target }}/release/package/*-setup.exe
            target/${{ steps.host.outputs.target }}/release/package/*.pkg
  publish:
    needs: build
    if: github.event_name == 'push' || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: daat-locus-*
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: artifacts/*
