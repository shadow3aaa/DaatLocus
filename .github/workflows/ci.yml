name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      DAAT_LOCUS_BUILD_WEBUI: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked -p daat-locus -p daat-locus-auth -p daat-locus-client-protocol -p daat-locus-macros -p xtask --all-targets -- -D warnings
      - run: cargo test --locked -p daat-locus --lib --bins --test http_api -- --test-threads=4
      - run: cargo test --locked -p daat-locus-auth -p daat-locus-client-protocol -p daat-locus-macros -p xtask
  desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - run: cargo install wasm-pack --locked
      - run: cargo clippy --locked -p daat-locus-app --all-targets -- -D warnings
      - run: cargo test --locked -p daat-locus-app
      - run: cargo build --locked -p daat-locus-app
  webui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
      - run: cargo install wasm-pack --locked
      - run: bun install --frozen-lockfile
        working-directory: webui
      - run: bun run typecheck && bun test && bun run build
        working-directory: webui
      - name: Verify default embedded build
        run: cargo build --locked -p daat-locus

  signaling:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/signaling
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,wasm32-unknown-unknown
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.11902837"
      - run: echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.11902837" >> "$GITHUB_ENV"
      - run: cargo install wasm-pack --locked
      - run: bun install --frozen-lockfile
        working-directory: webui
      - run: bun install --frozen-lockfile
        working-directory: clients/app
      - run: bun run android:build --debug
        working-directory: clients/app
