[package]
name = "daat-locus-workspace"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Device-local content-addressed workspace branches and native filesystem projections"

[dependencies]
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"
diffy = "0.5.0"
hex = "0.4.3"
ignore = "0.4.24"
gix-index = { version = "0.58.0", features = ["sha1", "sha256"] }
lru = "0.16.4"
parking_lot = "0.12.5"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
same-file = "1.0.6"
sha2 = "0.11.0"
thiserror = "2.0.18"
tempfile = "3.23.0"
uuid = { version = "1.23.4", features = ["v4"] }
zstd = { version = "0.13", default-features = false }

[target.'cfg(windows)'.dependencies]
dunce = "1.0.5"
libloading = "0.8.9"
winapi = { version = "0.3.9", features = ["std", "basetsd", "fileapi", "minwinbase", "minwindef", "ntdef", "ntstatus", "winnt", "sysinfoapi", "securitybaseapi", "handleapi", "processthreadsapi", "winbase", "errhandlingapi", "sddl", "ioapiset", "winreg", "stringapiset"] }

[target.'cfg(windows)'.dev-dependencies]
winapi = { version = "0.3.9", features = ["memoryapi", "ioapiset"] }

[target.'cfg(target_os = "linux")'.dependencies]
fuser = "0.18.0"
libc = "0.2"
