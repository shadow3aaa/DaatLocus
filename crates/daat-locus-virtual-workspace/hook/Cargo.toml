[package]
name = "daat-locus-workspace-hook"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "Thread-scoped Windows input hook for the virtual workspace experiment"

[lib]
crate-type = ["cdylib"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
