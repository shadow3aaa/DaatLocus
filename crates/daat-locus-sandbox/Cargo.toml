[package]
name = "daat-locus-sandbox"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Scoped filesystem policy and native sandbox process lifecycle."

[dependencies]
miette = "7.6.0"
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["io-util", "macros", "process", "rt", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
serde_json = "1.0.150"
tracing = "0.1.41"

[target.'cfg(windows)'.dependencies]
appcontainer_common = { git = "https://github.com/microsoft/mxc", rev = "6cd3d58f05d3447e67109cfb75e042803b843ca4" }
learning_mode_windows = { git = "https://github.com/microsoft/mxc", rev = "6cd3d58f05d3447e67109cfb75e042803b843ca4" }
wxc_common = { git = "https://github.com/microsoft/mxc", rev = "6cd3d58f05d3447e67109cfb75e042803b843ca4" }
tracelogging = "=1.2.3"
parking_lot = "0.12.5"
dunce = "1.0.5"
windows = { version = "0.62.2", features = ["Win32_UI_Shell", "Win32_System_Com", "Win32_Foundation"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_Security_Authorization"] }

[dev-dependencies]
uuid = { version = "1.23.4", features = ["v4"] }
tempfile = "3.23.0"
tokio = { version = "1.52.3", features = ["net", "rt-multi-thread"] }
